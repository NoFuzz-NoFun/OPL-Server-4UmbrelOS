[global]
    workgroup = WORKGROUP
    server string = OPL Server 4 UmbrelOS
    netbios name = UMBREL-OPL
    server role = standalone server
    security = user
    map to guest = Bad User
    guest account = nobody
    log level = 2

    server min protocol = NT1
    server max protocol = NT1
    client min protocol = NT1
    client max protocol = NT1
    ntlm auth = ntlmv1-permitted

    smb ports = 1024 445 139

    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
    use sendfile = yes
    strict locking = no
    unix extensions = no

[PS2SMB]
    comment = PS2 OPL Games
    path = /share/PS2SMB
    browseable = yes
    read only = no
    guest ok = yes
    public = yes
    writable = yes
    create mask = 0777
    directory mask = 0777
    force user = nobody
    force group = nogroup
