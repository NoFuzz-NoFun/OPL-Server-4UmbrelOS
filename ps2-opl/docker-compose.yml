version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ps2-opl_server_1
      APP_PORT: 8092
    restart: on-failure

  server:
    image: filebrowser/filebrowser:v2.30.0
    restart: on-failure
    user: "1000:1000"
    ports:
      - "8092:80"
    volumes:
      - ${APP_DATA_DIR}/data:/srv
      - ${APP_DATA_DIR}/filebrowser.db:/database/filebrowser.db

  samba:
    image: dperson/samba
    restart: on-failure
    ports:
      - "1024:445"
      - "139:139"
      - "445:445"
    environment:
      - USERID=1000
      - GROUPID=1000
    volumes:
      - ${APP_DATA_DIR}/data:/ps2
    command: '-s "PS2SMB;/ps2;yes;no;yes;all;none"'
