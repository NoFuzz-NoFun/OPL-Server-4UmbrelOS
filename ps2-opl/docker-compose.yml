version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ps2-opl_web_1
      APP_PORT: 80

  samba:
    image: alpine:3.19
    container_name: opl-server-samba
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ${APP_DATA_DIR}/data/PS2SMB:/share/PS2SMB
      - ./smb.conf:/etc/samba/smb.conf:ro
    command: >
      sh -c "apk add --no-cache samba && mkdir -p /var/log/samba /var/run/samba /var/lock/samba /run/samba && chmod -R 0777 /share/PS2SMB && exec smbd -F --no-process-group --debug-stdout -s /etc/samba/smb.conf"

  web:
    image: filebrowser/filebrowser:latest
    container_name: opl-server-web
    restart: unless-stopped
    ports:
      - "8092:80"
    volumes:
      - ${APP_DATA_DIR}/data/PS2SMB:/srv
    environment:
      - FB_NOAUTH=true
