version: "3.7"

services:
  app_proxy:
    restart: on-failure
    environment:
      APP_HOST: nofuzz_server_1
      APP_PORT: 8092

  server:
    image: alpine:3.19
    restart: on-failure
    ports:
      - "1024:1024"
    volumes:
      - ${APP_DATA_DIR}/data:/share/PS2SMB
    command: >
      sh -c "
        apk add --no-cache samba samba-common-tools python3 &&
        mkdir -p /share/PS2SMB/DVD /share/PS2SMB/CD /share/PS2SMB/ART /share/PS2SMB/CFG /share/PS2SMB/VMC /share/PS2SMB/THM /share/PS2SMB/APPS /share/PS2SMB/POPS &&
        chmod -R 0777 /share/PS2SMB &&
        mkdir -p /etc/samba &&
        cat << 'EOF' > /etc/samba/smb.conf
        [global]
            workgroup = WORKGROUP
            server string = Umbrel PS2 OPL Server
            netbios name = UMBREL-OPL
            server role = standalone server
            security = user
            map to guest = Bad User
            guest account = nobody
            server min protocol = NT1
            server max protocol = NT1
            client min protocol = NT1
            client max protocol = NT1
            ntlm auth = ntlmv1-permitted
            smb ports = 1024
            socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
            use sendfile = yes
            strict locking = no
            unix extensions = no
        [PS2SMB]
            comment = PS2 Games
            path = /share/PS2SMB
            browseable = yes
            read only = no
            writable = yes
            guest ok = yes
            public = yes
            force user = nobody
            force group = nogroup
            create mask = 0777
            directory mask = 0777
        EOF
        mkdir -p /var/www &&
        cat << 'HTMLEOF' > /var/www/index.html
        <!DOCTYPE html>
        <html><head><title>PS2 OPL Server</title><meta charset='utf-8'><style>body{background:#0f172a;color:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}div{text-align:center;padding:2.5rem;background:#1e293b;border-radius:1rem;border:1px solid #334155;box-shadow:0 10px 25px rgba(0,0,0,0.5);}h1{color:#38bdf8;margin-bottom:0.5rem;}p{color:#94a3b8;line-height:1.6;}code{background:#0f172a;padding:0.2rem 0.5rem;border-radius:0.25rem;color:#f1f5f9;font-size:0.95rem;}</style></head><body><div><h1>🎮 PS2 OPL Server Online!</h1><p>Servidor SMBv1 dedicado rodando no seu Umbrel OS.</p><p>Compartilhamento: <code>PS2SMB</code> | Porta OPL: <code>1024</code></p><p>Pasta de jogos no Umbrel: <code>app-data/nofuzz/data</code></p></div></body></html>
        HTMLEOF
        python3 -m http.server 8092 --directory /var/www &
        exec smbd -F -S -d 1 --configfile=/etc/samba/smb.conf
      "
